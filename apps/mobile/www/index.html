<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorkSylar</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0f0d;
        color: #e8f1ec;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      main { text-align: center; padding: 24px; }
      .logo {
        width: 56px; height: 56px; margin: 0 auto 18px;
        border-radius: 16px; background: #00b07b;
        display: grid; place-items: center; font-weight: 700; font-size: 24px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #9fb0a7; font-size: 13px; margin: 0 0 20px; }
      a {
        display: inline-block; padding: 10px 22px; border-radius: 999px;
        background: #00b07b; color: #fff; text-decoration: none; font-size: 14px;
      }
      .hint { margin-top: 18px; color: #6f7f76; font-size: 11px; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">W</div>
      <h1>WorkSylar</h1>
      <p>正在打开智能工作台…</p>
      <a id="open" href="https://app.worksylar.com">手动打开</a>
      <div class="hint">若长时间停留在此页，请检查网络或服务地址</div>
    </main>
    <script>
      // Capacitor 配置了 server.url 时会直接加载远端；这里只是未配置/加载失败时的兜底。
      (function () {
        var target = new URLSearchParams(location.search).get('server') || 'https://app.worksylar.com';
        var link = document.getElementById('open');
        if (link) link.href = target;
        setTimeout(function () {
          if (!window.Capacitor) location.replace(target);
        }, 600);
      })();
    </script>
  </body>
</html>
