# 一键容器化部署（本地/单机服务器）。
# 用法：./deploy.sh 或 .\deploy.cmd；首次会自动生成 .env.docker（随机密钥）。
# 开发用的基础设施 compose 仍保留在 apps/bff/docker-compose.yml，与本文件互相独立。
name: ai-office

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_office}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.docker 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ai_office}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging

  minio:
    # 钉版本，避免 :latest 漂移（容器内无 curl/mc，健康检查由 runtime 启动前轮询完成）。
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在 .env.docker 中设置 MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    logging: *default-logging

  # 一次性初始化：建 pgvector 扩展 → 同步 Prisma 结构 → 中文注释 → 套餐/模型价格种子。
  # 依赖 db-init 完成后 bff 才启动；db push 只适用于当前“无迁移文件”的仓库状态。
  db-init:
    build:
      context: .
      target: bff
    image: ai-office/bff:${APP_VERSION:-dev}
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_office}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_office}?schema=public
    command:
      - sh
      - -c
      - |
        set -eu
        printf 'CREATE EXTENSION IF NOT EXISTS vector;\n' | ./node_modules/.bin/prisma db execute --stdin --schema prisma/schema.prisma
        ./node_modules/.bin/prisma db push --skip-generate
        node scripts/apply-comments.mjs
        node scripts/seed-billing.mjs
        node scripts/backfill-kb.mjs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  agent-runtime:
    build:
      context: .
      target: agent-runtime
    image: ai-office/agent-runtime:${APP_VERSION:-dev}
    env_file:
      - .env.docker
    environment:
      # 容器内必须监听全部网卡，否则 bff 无法访问；token 由部署脚本生成并强制校验。
      AGENT_RUNTIME_HOST: 0.0.0.0
      AGENT_RUNTIME_PORT: "4001"
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:?请在 .env.docker 中设置 AGENT_RUNTIME_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?请在 .env.docker 中设置 INTERNAL_TOKEN}
      BFF_INTERNAL_URL: http://bff:4000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-artifacts}
    command:
      - sh
      - -c
      - node /usr/local/bin/wait-for-http.mjs http://minio:9000/minio/health/live 60000 && exec node dist/server.js
    depends_on:
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  bff:
    build:
      context: .
      target: bff
    image: ai-office/bff:${APP_VERSION:-dev}
    env_file:
      - .env.docker
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_office}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_office}?schema=public
      REDIS_URL: redis://redis:6379
      AGENT_RUNTIME_URL: http://agent-runtime:4001
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      # runtime 通过该地址回查连接器/知识库内部端点。
      BFF_INTERNAL_URL: http://bff:4000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-artifacts}
      # 运营端独立应用地址：用于告警 webhook 的 dashboardUrl 与浏览器跳转。
      ADMIN_WEB_URL: ${ADMIN_WEB_URL:-http://localhost:3001}
    ports:
      - "${BFF_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      agent-runtime:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

  web:
    build:
      context: .
      target: web
      args:
        # 浏览器直连 BFF 的地址，构建期内联；远程部署须改成对外可达的地址后重新构建。
        NEXT_PUBLIC_BFF_URL: ${WEB_BFF_URL:-http://localhost:4000}
        # 运营端外链；留空则客户端不显示“运营平台”入口（管理员也看不到）。
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_WEB_URL:-}
    image: ai-office/web:${APP_VERSION:-dev}
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      bff:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

  # 运营端：默认不随客户端栈启动（profile: admin），通常只在内网部署。
  # 不依赖核心栈、不注入 .env.docker：镜像内没有密钥，所有配置都是构建期 URL。
  # 同机附加：./deploy.sh --with-admin；单独内网主机：./deploy.sh --admin-only。
  admin-web:
    profiles: ["admin"]
    build:
      context: .
      target: admin
      args:
        # 浏览器（运营人员）直连 BFF 的地址；内网地址需在构建时确定。
        ADMIN_BFF_URL: ${ADMIN_BFF_URL:-http://localhost:4000}
        WORKSPACE_URL: ${WORKSPACE_URL:-}
    image: ai-office/admin:${APP_VERSION:-dev}
    environment:
      NODE_ENV: production
    ports:
      # 默认只绑定回环地址，避免误暴露到公网；内网访问请显式设置 ADMIN_WEB_BIND。
      - "${ADMIN_WEB_BIND:-127.0.0.1}:${ADMIN_WEB_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging

volumes:
  pgdata:
  minio-data:
  redis-data:
