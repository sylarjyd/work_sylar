# WorkSylar 官网 Nginx 配置示例
# 1) 把 site/ 目录同步到 /var/www/worksylar/site
# 2) 将 server_name 换成你的域名，并用 certbot 申请证书（或换成已有证书路径）
# 3) nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name worksylar.com www.worksylar.com;

    # 上线后启用 HTTPS 跳转（证书就绪后再打开）
    # return 301 https://$host$request_uri;

    root /var/www/worksylar/site;
    index index.html;

    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript text/html image/svg+xml;

    # 静态资源长缓存，html 不缓存，便于发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

